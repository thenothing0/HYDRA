[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-security"
version = "1.0.0"
description = "HYDRA — Autonomous AI Security Intelligence & Orchestration Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "THENOTHING Contributors"}]
maintainers = [{name = "THENOTHING Contributors"}]
keywords = [
    "security", "bug-bounty", "pentesting", "reconnaissance",
    "mcp", "offensive-security", "vulnerability-scanner",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer",
    "rich>=13.0.0",
    "pydantic",
    "python-dotenv>=1.0.0",
    "textual>=3.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0",
    "psutil>=5.9.0",
    "click>=8.0",
    "mcp[cli]>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "build",
    "twine",
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "sentence-transformers>=2.2.0",
]
dashboard = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=12.0",
]
vector = ["chromadb>=0.4.0"]
browser = ["playwright>=1.40"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]
all = ["hydra-security[ai,dashboard,vector,browser,docs]"]

[project.urls]
Homepage = "https://github.com/thenothing-sec/hydra"
Documentation = "https://github.com/thenothing-sec/hydra/tree/main/docs"
Repository = "https://github.com/thenothing-sec/hydra"
Issues = "https://github.com/thenothing-sec/hydra/issues"
Changelog = "https://github.com/thenothing-sec/hydra/blob/main/CHANGELOG.md"

[project.scripts]
hydra = "control_center.run:main"
hydra-engine = "hydra.main:entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["hydra*", "control_center*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Default run excludes the real-tool suites so CI passes with no Kali / no network.
# Run them explicitly with:  pytest -m integration   /   pytest -m e2e
addopts = "-v --tb=short --strict-markers -m 'not integration and not e2e'"
asyncio_mode = "auto"
markers = [
    "integration: exercises REAL security binaries; skipped unless installed and HYDRA_RUN_INTEGRATION=1",
    "e2e: full real-tool workflow runs; opt-in only",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["hydra", "control_center", "mcp_server"]
omit = ["*/__pycache__/*", "tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
